<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sikho Star — Level</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Open+Sans:wght@400;600&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .level-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg-cream);
    }

    /* PROGRESS BAR */
    .quiz-progress-bar {
      height: 8px;
      background: #E0E0E0;
      position: relative;
    }
    .quiz-progress-fill {
      height: 100%;
      border-radius: 0 4px 4px 0;
      transition: width 0.4s ease;
    }

    /* QUESTION AREA */
    .quiz-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px 16px 12px;
      max-width: 560px;
      margin: 0 auto;
      width: 100%;
      gap: 20px;
    }

    .question-counter {
      font-family: var(--font-heading);
      font-size: 15px;
      color: var(--text-medium);
      text-align: center;
    }

    .question-card {
      background: white;
      border-radius: var(--radius);
      padding: 24px 20px;
      box-shadow: var(--shadow-sm);
      text-align: center;
    }

    .question-mascot {
      font-size: 44px;
      margin-bottom: 8px;
      animation: float 3s ease-in-out infinite;
      display: block;
    }

    .question-text {
      font-family: var(--font-heading);
      font-size: clamp(19px, 4.5vw, 24px);
      font-weight: 700;
      color: var(--text-dark);
      line-height: 1.4;
    }

    /* CHOICES */
    .choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .choice-btn {
      background: white;
      border: 3px solid #E0E0E0;
      border-radius: var(--radius-sm);
      padding: 16px 12px;
      font-family: var(--font-heading);
      font-size: clamp(16px, 3.5vw, 20px);
      font-weight: 600;
      color: var(--text-dark);
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 64px;
      text-align: center;
      line-height: 1.3;
    }

    .choice-btn:hover:not(:disabled) {
      border-color: var(--sky-blue);
      background: #E3F2FD;
      transform: scale(1.03);
    }

    .choice-btn.correct {
      border-color: var(--success-green);
      background: #E8F5E9;
      color: #2E7D32;
      animation: pop 0.4s ease both;
    }

    .choice-btn.wrong {
      border-color: #EF5350;
      background: #FFEBEE;
      color: #C62828;
      animation: shake 0.4s ease both;
    }

    .choice-btn:disabled { cursor: not-allowed; }

    /* FEEDBACK */
    .feedback-bar {
      border-radius: var(--radius-sm);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-heading);
      font-size: 18px;
      font-weight: 700;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
      min-height: 56px;
    }
    .feedback-bar.show {
      opacity: 1;
      transform: translateY(0);
    }
    .feedback-bar.correct-fb { background: #E8F5E9; color: #2E7D32; }
    .feedback-bar.wrong-fb   { background: #FFEBEE; color: #C62828; }

    /* NEXT BUTTON */
    .next-btn-wrap {
      padding: 0 16px 24px;
      max-width: 560px;
      margin: 0 auto;
      width: 100%;
    }

    /* RESULT OVERLAY */
    #result-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #1a237e, #283593);
      z-index: 300;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 32px;
      text-align: center;
    }
    #result-overlay.show { display: flex; }

    .result-mascot { font-size: 88px; animation: bounce-in 0.6s ease both; }
    .result-title {
      font-family: var(--font-heading);
      font-size: clamp(28px, 7vw, 44px);
      font-weight: 700;
      color: var(--sunny-yellow);
    }
    .result-stars { font-size: 48px; letter-spacing: 8px; animation: star-pop 0.5s 0.3s both; }
    .result-score {
      font-family: var(--font-heading);
      font-size: 20px;
      color: rgba(255,255,255,0.9);
    }
    .result-btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
  </style>
</head>
<body>
<div class="level-page fade-in">

  <!-- HEADER -->
  <header class="page-header" id="level-header">
    <button class="back-btn" onclick="confirmExit()">←</button>
    <span class="page-title" id="level-title">Level</span>
    <span id="level-icon" style="font-size:26px;"></span>
  </header>

  <!-- QUIZ PROGRESS -->
  <div class="quiz-progress-bar">
    <div class="quiz-progress-fill" id="quiz-progress" style="width:0%"></div>
  </div>

  <!-- QUIZ AREA -->
  <div class="quiz-area">
    <div class="question-counter" id="q-counter">Question 1 / 5</div>

    <div class="question-card bounce-in">
      <span class="question-mascot" id="q-mascot">🤖</span>
      <p class="question-text" id="q-text">Loading...</p>
    </div>

    <div class="choices-grid" id="choices-grid"></div>

    <div class="feedback-bar" id="feedback-bar"></div>
  </div>

  <!-- NEXT BUTTON -->
  <div class="next-btn-wrap">
    <button id="btn-next" class="btn btn-primary btn-large hidden">
      Next Question ➡️
    </button>
  </div>

</div>

<!-- RESULT OVERLAY -->
<div id="result-overlay">
  <span class="result-mascot" id="res-mascot">🤖</span>
  <div class="result-title" id="res-title">Shabaash!</div>
  <div class="result-stars" id="res-stars">⭐⭐⭐</div>
  <div class="result-score" id="res-score">5/5 sahi jawab!</div>
  <div class="result-btns">
    <button class="btn btn-primary" id="btn-map">🗺️ Map</button>
    <button class="btn btn-green" id="btn-minigame" style="background:linear-gradient(135deg,#7B1FA2,#AB47BC);box-shadow:0 8px 24px rgba(123,31,162,0.4);">🎮 Play Game</button>
    <button class="btn btn-secondary" id="btn-retry">🔄 Retry</button>
  </div>
</div>

<script src="../js/progress.js"></script>
<script src="../js/audio.js"></script>
<script src="../js/data/maths.js"></script>
<script src="../js/data/science.js"></script>
<script src="../js/data/english.js"></script>
<script src="../js/data/urdu.js"></script>
<script src="../js/level.js"></script>
</body>
</html>
