<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sikho Star — Balloon Pop Quiz</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎈</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    body { background: linear-gradient(160deg,#0D1B2A,#1a237e,#4A148C); overflow: hidden; }

    #bp-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      background: rgba(0,0,0,0.35); backdrop-filter: blur(10px);
      padding: 10px 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .bp-back { background: rgba(255,255,255,0.15); border: none; color: white;
      border-radius: 50%; width: 40px; height: 40px; font-size: 20px; cursor: pointer; }
    #bp-question-box {
      flex: 1; margin: 0 12px;
      background: rgba(255,255,255,0.12); border-radius: 16px; padding: 10px 14px;
      font-family: var(--font-heading); font-size: clamp(14px,3.5vw,18px);
      font-weight: 700; color: white; text-align: center; line-height: 1.3;
    }
    #bp-score-box {
      font-family: var(--font-heading); font-size: 16px; font-weight: 700;
      color: #FFD54F; min-width: 64px; text-align: right;
    }

    #bp-arena {
      position: fixed; top: 72px; left: 0; right: 0; bottom: 60px;
      overflow: hidden;
    }

    .bp-balloon {
      position: absolute;
      display: flex; flex-direction: column; align-items: center;
      cursor: pointer; user-select: none;
      animation: bp-rise var(--dur) linear forwards;
    }
    .bp-balloon-body {
      border-radius: 50% 50% 50% 50% / 45% 45% 55% 55%;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-heading); font-weight: 700; color: white;
      text-align: center; line-height: 1.2; padding: 8px;
      box-shadow: inset -8px -8px 20px rgba(0,0,0,0.2), inset 4px 4px 12px rgba(255,255,255,0.3);
      transition: transform 0.1s ease;
    }
    .bp-balloon:active .bp-balloon-body { transform: scale(0.88); }
    .bp-balloon-string {
      width: 2px; height: 30px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.6), rgba(255,255,255,0.1));
    }
    .bp-balloon.correct-pop .bp-balloon-body {
      animation: bubble-pop 0.3s ease forwards;
    }
    .bp-balloon.wrong-pop .bp-balloon-body {
      animation: shake 0.35s ease both;
    }

    @keyframes bp-rise {
      from { transform: translateY(0) rotate(0deg); opacity: 1; }
      to   { transform: translateY(var(--rise)) rotate(var(--sway)); opacity: 0.8; }
    }

    #bp-feedback {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      font-family: var(--font-heading); font-size: 52px; font-weight: 700;
      pointer-events: none; opacity: 0; z-index: 90; text-align: center;
    }

    #bp-footer {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.35); backdrop-filter: blur(10px);
      padding: 10px 20px; display: flex; align-items: center; justify-content: center; gap: 20px;
    }
    .bp-progress-pip {
      width: 10px; height: 10px; border-radius: 50%;
      background: rgba(255,255,255,0.25); transition: all 0.3s ease;
    }
    .bp-progress-pip.done { background: #FFD54F; box-shadow: 0 0 8px #FFD54F; }
    .bp-progress-pip.active { background: white; transform: scale(1.3); }
    #bp-combo-label {
      font-family: var(--font-heading); font-size: 16px; font-weight: 700;
      color: #FFD54F; min-width: 60px; text-align: center;
    }

    #bp-start, #bp-result {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; padding: 32px; text-align: center;
      background: linear-gradient(135deg,#0D1B2A,#1a237e,#4A148C);
    }
    #bp-result { display: none; }

    .bp-screen-title {
      font-family: var(--font-heading); font-size: clamp(30px,8vw,48px);
      font-weight: 700; color: #FFD54F;
    }
    .bp-screen-sub {
      font-family: var(--font-heading); font-size: 17px;
      color: rgba(255,255,255,0.85); max-width: 320px; line-height: 1.5;
    }
    .bp-stars { font-size: 52px; letter-spacing: 8px; animation: star-pop 0.5s 0.3s both; }
  </style>
</head>
<body>

<div id="bp-start">
  <div style="font-size:72px; animation:float 2s ease-in-out infinite;">🎈</div>
  <div class="bp-screen-title">Balloon Pop Quiz!</div>
  <div class="bp-screen-sub">Pop the balloon with the correct answer! Wrong balloons will shake — choose wisely! 🎯</div>
  <button class="btn btn-primary btn-large" onclick="startGame()" style="font-size:20px;padding:16px 40px;">
    🚀 Play!
  </button>
  <button onclick="window.location.href='dashboard.html'" style="background:none;border:none;color:rgba(255,255,255,0.6);font-family:var(--font-heading);font-size:16px;cursor:pointer;">← Back to Home</button>
</div>

<header id="bp-header" style="display:none;">
  <button class="bp-back" onclick="confirmExit()">←</button>
  <div id="bp-question-box">Loading...</div>
  <div id="bp-score-box">0 pts</div>
</header>

<div id="bp-arena"></div>

<div id="bp-feedback"></div>

<footer id="bp-footer" style="display:none;">
  <div id="bp-combo-label"></div>
  <div id="bp-pips" style="display:flex;gap:6px;"></div>
</footer>

<div id="bp-result">
  <div id="bp-res-mascot" style="font-size:80px;animation:bounce-in 0.6s ease both;">🏆</div>
  <div class="bp-screen-title" id="bp-res-title">Amazing!</div>
  <div class="bp-stars" id="bp-res-stars">⭐⭐⭐</div>
  <div class="bp-screen-sub" id="bp-res-score"></div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;">
    <button class="btn btn-primary" onclick="startGame()">🔄 Play Again</button>
    <button class="btn btn-secondary" onclick="window.location.href='dashboard.html'">🏠 Home</button>
  </div>
</div>

<script src="../js/progress.js"></script>
<script src="../js/audio.js"></script>
<script src="../js/data/maths.js"></script>
<script src="../js/data/science.js"></script>
<script src="../js/data/english.js"></script>
<script src="../js/data/urdu.js"></script>
<script src="../js/data/islamic.js"></script>
<script>

const BALLOON_COLORS = [
  '#E53935','#E91E63','#9C27B0','#3F51B5',
  '#1E88E5','#00897B','#F9A825','#F4511E',
];

const TOTAL_QS = 10;

let allQuestions = [];
let pool = [];
let qIndex = 0;
let score = 0;
let combo = 0;
let answered = false;
let spawnHandle = null;
let age = 7;

function buildPool() {
  const srcs = [
    typeof MATHS_DATA   !== 'undefined' ? MATHS_DATA   : null,
    typeof SCIENCE_DATA !== 'undefined' ? SCIENCE_DATA : null,
    typeof ENGLISH_DATA !== 'undefined' ? ENGLISH_DATA : null,
    typeof URDU_DATA    !== 'undefined' ? URDU_DATA    : null,
    typeof ISLAMIC_DATA !== 'undefined' ? ISLAMIC_DATA : null,
  ].filter(Boolean);

  const qs = [];
  srcs.forEach(subj => {
    subj.levels.forEach(lvl => {
      lvl.questions.forEach(q => qs.push({ ...q, subject: subj }));
    });
  });

  /* Shuffle and pick TOTAL_QS */
  const shuffled = qs.sort(() => Math.random() - 0.5);
  /* Age filter: simpler questions for younger kids */
  const filtered = age <= 7
    ? shuffled.filter((_, i) => i < 80).slice(0, TOTAL_QS)
    : shuffled.slice(0, TOTAL_QS);
  return filtered.length >= TOTAL_QS ? filtered : shuffled.slice(0, TOTAL_QS);
}

function startGame() {
  Progress.load();
  Audio.init(Progress.data?.settings || {});
  age = parseInt(Progress.data?.profile?.age) || 7;

  allQuestions = buildPool();
  qIndex = 0; score = 0; combo = 0; answered = false;

  document.getElementById('bp-start').style.display = 'none';
  document.getElementById('bp-result').style.display = 'none';
  document.getElementById('bp-header').style.display = 'flex';
  document.getElementById('bp-footer').style.display = 'flex';

  buildPips();
  loadQuestion();
}

function buildPips() {
  const wrap = document.getElementById('bp-pips');
  wrap.innerHTML = '';
  for (let i = 0; i < TOTAL_QS; i++) {
    const d = document.createElement('div');
    d.className = 'bp-progress-pip' + (i === 0 ? ' active' : '');
    d.id = `pip-${i}`;
    wrap.appendChild(d);
  }
}

function updatePip(i, state) {
  const p = document.getElementById(`pip-${i}`);
  if (!p) return;
  p.className = 'bp-progress-pip' + (state === 'done' ? ' done' : state === 'active' ? ' active' : '');
}

function loadQuestion() {
  if (qIndex >= allQuestions.length) { showResult(); return; }

  answered = false;
  const q = allQuestions[qIndex];

  updatePip(qIndex - 1, 'done');
  updatePip(qIndex, 'active');

  document.getElementById('bp-question-box').textContent = q.q;
  document.getElementById('bp-score-box').textContent = `${score} pts`;
  document.getElementById('bp-combo-label').textContent = combo >= 2 ? `🔥 ${combo}x` : '';

  clearArena();
  spawnBalloons(q);
}

function clearArena() {
  const arena = document.getElementById('bp-arena');
  arena.innerHTML = '';
  if (spawnHandle) { clearTimeout(spawnHandle); spawnHandle = null; }
}

function spawnBalloons(q) {
  const arena = document.getElementById('bp-arena');
  const aW = arena.clientWidth;
  const aH = arena.clientHeight;
  const bSize = age <= 7 ? 110 : 90;
  const riseDur = age <= 6 ? 8000 : age <= 8 ? 6000 : 4500;

  const positions = distributePositions(q.choices.length, aW, bSize);

  q.choices.forEach((text, idx) => {
    spawnHandle = setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'bp-balloon bounce-in';
      const col = BALLOON_COLORS[idx % BALLOON_COLORS.length];
      const sway = (Math.random() > 0.5 ? 1 : -1) * (5 + Math.random() * 12) + 'deg';
      const riseVal = -(aH + bSize + 60) + 'px';

      el.style.cssText = `
        left:${positions[idx]}px; bottom:-${bSize + 40}px;
        --dur:${riseDur + idx * 600}ms; --rise:${riseVal}; --sway:${sway};
      `;
      el.innerHTML = `
        <div class="bp-balloon-body" style="
          width:${bSize}px; height:${bSize + 16}px;
          background:radial-gradient(circle at 35% 30%, ${lighten(col)}, ${col});
          font-size:${bSize > 100 ? 16 : 14}px;
        ">${text}</div>
        <div class="bp-balloon-string"></div>
      `;

      el.addEventListener('click', () => handlePop(idx, q.answer, el, text));
      arena.appendChild(el);

      /* Auto-wrong when it escapes */
      el.addEventListener('animationend', (e) => {
        if (e.animationName === 'bp-rise' && !answered) {
          if (idx === q.answer) {
            handlePop(-1, q.answer, el, text); /* correct one escaped */
          }
        }
      });
    }, idx * 400);
  });
}

function distributePositions(count, areaW, bSize) {
  const spacing = Math.min((areaW - bSize) / count, areaW / (count + 1));
  const start = (areaW - spacing * (count - 1) - bSize) / 2;
  return Array.from({ length: count }, (_, i) => Math.max(4, start + i * spacing + (Math.random() - 0.5) * 20));
}

function lighten(hex) {
  const num = parseInt(hex.slice(1), 16);
  const r = Math.min(255, ((num >> 16) & 0xff) + 60);
  const g = Math.min(255, ((num >> 8) & 0xff) + 60);
  const b = Math.min(255, (num & 0xff) + 60);
  return `rgb(${r},${g},${b})`;
}

function handlePop(chosen, correct, el, text) {
  if (answered) return;
  answered = true;
  clearArena();

  const isRight = chosen === correct;

  showFeedback(isRight ? '✅ Correct! 🎉' : `❌ It was: "${allQuestions[qIndex].choices[correct]}"`);

  if (isRight) {
    score += 10 + combo * 3;
    combo++;
    Audio.play(combo >= 3 ? 'fanfare' : 'correct');
    burstParticles();
  } else {
    combo = 0;
    Audio.play('wrong');
  }

  document.getElementById('bp-score-box').textContent = `${score} pts`;
  document.getElementById('bp-combo-label').textContent = combo >= 2 ? `🔥 ${combo}x` : '';

  setTimeout(() => {
    qIndex++;
    loadQuestion();
  }, isRight ? 900 : 1400);
}

function showFeedback(text) {
  const fb = document.getElementById('bp-feedback');
  fb.style.transition = 'none';
  fb.style.opacity = '1';
  fb.style.transform = 'translate(-50%,-50%) scale(1.2)';
  fb.innerHTML = `<div style="font-size:24px;text-shadow:0 2px 12px rgba(0,0,0,0.5);">${text}</div>`;
  setTimeout(() => {
    fb.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
    fb.style.opacity = '0';
    fb.style.transform = 'translate(-50%,-70%) scale(1)';
  }, 100);
}

function burstParticles() {
  const colors = ['#FFD54F','#F06292','#66BB6A','#4FC3F7','#FF9800','#CE93D8','#fff'];
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    const angle = (i / 20) * Math.PI * 2;
    const dist = 70 + Math.random() * 60;
    p.style.cssText = `
      position:fixed;left:${cx}px;top:${cy}px;
      width:${7+Math.random()*8}px;height:${7+Math.random()*8}px;
      border-radius:${Math.random()>.5?'50%':'3px'};
      background:${colors[i % colors.length]};pointer-events:none;z-index:999;
      --dx:${Math.cos(angle)*dist}px;--dy:${Math.sin(angle)*dist}px;
      animation:particle-out 0.7s ease-out forwards;
    `;
    document.body.appendChild(p);
    p.addEventListener('animationend', () => p.remove());
  }
}

function showResult() {
  updatePip(qIndex - 1, 'done');
  document.getElementById('bp-header').style.display = 'none';
  document.getElementById('bp-footer').style.display = 'none';

  const pct = Math.round((score / (TOTAL_QS * 10)) * 100);
  const stars = pct >= 80 ? 3 : pct >= 50 ? 2 : 1;
  const res = document.getElementById('bp-result');
  res.style.display = 'flex';

  let mascot = '💪', title = "Keep trying!";
  if (pct >= 90) { mascot = '🏆'; title = 'Perfect! Outstanding! 🎊'; }
  else if (pct >= 70) { mascot = '⭐'; title = 'Excellent! Well Done! 🌟'; }
  else if (pct >= 50) { mascot = '😊'; title = 'Good Job! Keep it up! 👍'; }

  document.getElementById('bp-res-mascot').textContent = mascot;
  document.getElementById('bp-res-title').textContent = title;
  document.getElementById('bp-res-stars').textContent =
    Array.from({length:3}, (_,i) => i < stars ? '⭐' : '☆').join('');
  document.getElementById('bp-res-score').textContent =
    `Score: ${score} pts • Best combo: ${combo}x`;

  Audio.play(pct >= 80 ? 'win' : 'levelup');
  launchConfetti(pct >= 70 ? 50 : 20);
}

function launchConfetti(count) {
  const colors = ['#FFD54F','#F06292','#66BB6A','#4FC3F7','#FF9800','#CE93D8'];
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.cssText = `
        left:${Math.random()*100}vw; top:-20px;
        background:${colors[Math.floor(Math.random()*colors.length)]};
        width:${8+Math.random()*10}px; height:${8+Math.random()*10}px;
        border-radius:${Math.random()>0.5?'50%':'2px'};
        animation-duration:${1.5+Math.random()*2}s;
      `;
      document.body.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }, i * 30);
  }
}

function confirmExit() {
  if (confirm('Leave Balloon Pop Quiz?')) {
    clearArena();
    window.location.href = 'dashboard.html';
  }
}
</script>
</body>
</html>
