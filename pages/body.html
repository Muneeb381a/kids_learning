<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sikho Star — Body Parts</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧍</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Open+Sans:wght@400;600&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    body { background: linear-gradient(160deg,#E0F7FA 0%,#FFF8E1 55%,#E8F5E9 100%); }
    .body-page { min-height:100vh; display:flex; flex-direction:column; }

    /* Layout */
    .main-area {
      display:flex; flex:1; padding:14px 16px 6px; gap:16px; align-items:flex-start;
    }
    .svg-panel { display:flex; flex-direction:column; align-items:center; flex-shrink:0; }
    .info-panel { flex:1; display:flex; flex-direction:column; gap:10px; min-width:0; }

    /* View toggle */
    .view-toggle {
      display:flex; gap:6px; margin-bottom:10px;
      background:white; border-radius:28px; padding:4px;
      box-shadow:0 2px 8px rgba(0,0,0,0.12);
    }
    .toggle-btn {
      padding:7px 16px; border-radius:24px; border:none;
      font-family:var(--font-heading); font-size:14px; font-weight:700;
      background:transparent; color:#546E7A; cursor:pointer; transition:all 0.2s;
    }
    .toggle-btn.active { background:linear-gradient(135deg,#26A69A,#00796B); color:white; box-shadow:0 2px 6px rgba(0,150,136,0.4); }

    /* SVG wrapper + transitions */
    .svg-wrapper { position:relative; }
    .body-svg {
      width:210px; height:auto; overflow:visible;
      filter:drop-shadow(0 8px 18px rgba(0,0,0,0.14));
      display:block;
    }
    @keyframes sv-in  { from { opacity:0; transform:translateX(18px) scale(0.97); } to { opacity:1; transform:none; } }
    @keyframes sv-out { from { opacity:1; } to { opacity:0; transform:translateX(-12px) scale(0.97); } }
    .sv-entering { animation:sv-in 0.32s ease both; }
    .sv-exiting  { animation:sv-out 0.22s ease both; }

    /* View label */
    .view-label {
      margin-top:8px; font-family:var(--font-heading); font-size:12px;
      font-weight:700; color:#78909C; letter-spacing:0.5px; text-transform:uppercase; text-align:center;
    }

    /* Hotspot styles */
    @keyframes hs-ring {
      0%,100% { transform:scale(1); opacity:0.28; }
      50%      { transform:scale(1.4); opacity:0.1; }
    }
    .hs-outer {
      transform-box:fill-box; transform-origin:center;
      animation:hs-ring 2.2s ease-in-out infinite;
    }
    .hs-inner { stroke:white; stroke-width:2.5; transition:transform 0.18s ease; transform-box:fill-box; transform-origin:center; }
    .hotspot-g { cursor:pointer; }
    .hotspot-g:hover .hs-inner { transform:scale(1.15); }
    .hotspot-g.active .hs-outer { animation:none; opacity:0.42; transform:scale(1.25); }
    .hotspot-g.active .hs-inner { transform:scale(1.1); }
    .hs-emoji { font-size:12px; dominant-baseline:central; text-anchor:middle; pointer-events:none; user-select:none; }

    /* Info card */
    .info-card {
      background:white; border-radius:var(--radius);
      box-shadow:var(--shadow-sm); overflow:hidden;
    }
    .part-color-bar { height:5px; transition:background 0.3s; }

    .info-prompt {
      display:flex; flex-direction:column; align-items:center;
      gap:10px; padding:24px 20px; text-align:center;
    }
    .prompt-mascot { font-size:54px; animation:float 3s ease-in-out infinite; }
    .info-prompt p { font-family:var(--font-heading); font-size:15px; color:var(--text-medium); line-height:1.5; margin:0; }
    .prompt-hint { font-size:13px !important; color:#90A4AE !important; }

    .part-detail { display:none; flex-direction:column; }
    .part-detail.show { display:flex; animation:fade-in 0.3s ease both; }

    .part-top { display:flex; align-items:center; gap:14px; padding:16px 18px 12px; }
    .part-big-emoji { font-size:54px; line-height:1; flex-shrink:0; animation:pop 0.4s ease both; }
    .part-names { display:flex; flex-direction:column; gap:3px; }
    .part-view-badge {
      display:inline-block; padding:2px 10px; border-radius:20px;
      font-family:var(--font-heading); font-size:11px; font-weight:700;
      color:white; background:#607D8B; width:fit-content; margin-bottom:2px;
    }
    .part-en { font-family:var(--font-heading); font-size:22px; font-weight:700; color:var(--text-dark); }
    .part-ur { font-family:var(--font-urdu); font-size:18px; color:var(--text-medium); direction:rtl; }

    .part-body { display:flex; flex-direction:column; gap:10px; padding:0 18px 16px; }
    .part-desc { background:var(--bg-cream); border-radius:14px; padding:11px 14px; font-size:14px; color:var(--text-dark); line-height:1.65; }
    .part-fact {
      background:#E3F2FD; border-radius:12px; padding:10px 13px;
      font-size:13px; color:#1565C0; font-weight:600;
      display:flex; gap:8px; align-items:flex-start; line-height:1.5;
    }
    .roomi-says {
      background:#E8F5E9; border-radius:12px; padding:9px 13px;
      font-family:var(--font-heading); font-size:14px; color:#2E7D32; font-weight:700;
    }

    /* Footer */
    .body-footer {
      background:white; padding:12px 16px;
      display:flex; align-items:center; gap:12px;
      box-shadow:0 -2px 8px rgba(0,0,0,0.08); position:sticky; bottom:0;
    }
    .explore-info { font-family:var(--font-heading); font-size:15px; font-weight:700; color:var(--text-dark); flex:1; }
    .explore-info span { color:var(--success-green); }
    .explore-dots { display:flex; gap:5px; flex-wrap:wrap; max-width:140px; margin-top:4px; }
    .exp-dot { width:11px; height:11px; border-radius:50%; background:#E0E0E0; transition:background 0.35s, transform 0.2s; }
    .exp-dot.done { background:var(--success-green); transform:scale(1.15); }

    /* Mobile */
    @media (max-width:520px) {
      .main-area { flex-direction:column; align-items:center; padding:10px 12px 4px; }
      .body-svg  { width:170px; }
      .info-panel { width:100%; }
      .part-top { padding:14px 16px 10px; }
      .part-body { padding:0 16px 14px; }
      .part-big-emoji { font-size:44px; }
      .part-en { font-size:19px; }
    }
    @media (min-width:521px) {
      .main-area { max-width:780px; margin:0 auto; width:100%; }
      .svg-panel { position:sticky; top:70px; }
    }
  </style>
</head>

<script>

    desc:'Reeth ki haddi peeth ke beech mein hoti hai — 33 chhoti haddiyon (vertebrae) se bani hoti hai. Ye hamein seedha rakhti hai!',
    fact:'Reeth ki haddi ek spring ki tarah kaam karti hai — jump karne par jhatka absorb karti hai!',
    roomi:'🤖 Seedhe baitho! Reeth ki haddi ki madad karo! 🦴'
  },
  gurda: {
    en:'Kidneys', ur:'گردے', emoji:'🫘', color:'#EF5350', view:'back',
    desc:'Gurday khoon ko filter karte hain — bekar cheezein nikaal dete hain. Insaan ke do gurday hote hain!',
    fact:'Gurday ek din mein 180 liter khoon filter karte hain — factory ki tarah kaam karte hain!',
    roomi:'🤖 Gurde chupe hain peeth mein — magar kaam bht bada karte hain! 🫘'
  }
};

const TOTAL_PARTS = 12;
const VIEW_LABELS = { front:'Agla Hissa', back:'Peechla Hissa', both:'Dono Taraf' };
const VIEW_BADGE_COLORS = { front:'#26A69A', back:'#5C6BC0', both:'#FF9800' };
const ROOMI_EXPLORE = [
  '🤖 Wah! Ye dekh liya!',
  '🤖 Shabaash! Ek aur dhundo!',
  '🤖 Zabardast! Tum bohot ache ho!',
  '🤖 Star student! ⭐ Aur dekho!',
  '🤖 Kamaal! Almost there! 🔥'
];

let explored  = new Set();
let lastPart  = null;
let curView   = 'front';

function buildDots() {
  const c = document.getElementById('explore-dots');
  for (let i = 0; i < TOTAL_PARTS; i++) {
    const d = document.createElement('div');
    d.className = 'exp-dot';
    c.appendChild(d);
  }
}

function updateDots() {
  const n = explored.size;
  document.querySelectorAll('.exp-dot').forEach((d, i) => d.classList.toggle('done', i < n));
  document.getElementById('explored-count').textContent = n;
}

function showPart(partId) {
  const p = PARTS[partId];
  if (!p) return;

  document.querySelectorAll('.hotspot-g').forEach(g =>
    g.classList.toggle('active', g.dataset.part === partId)
  );

  document.getElementById('info-prompt').style.display = 'none';
  const detail = document.getElementById('part-detail');
  detail.classList.remove('show');
  void detail.offsetWidth;
  detail.classList.add('show');

  document.getElementById('pd-bar').style.background = p.color;
  document.getElementById('pd-emoji').textContent  = p.emoji;
  document.getElementById('pd-en').textContent     = p.en;
  document.getElementById('pd-ur').textContent     = p.ur;
  document.getElementById('pd-desc').textContent   = p.desc;
  document.getElementById('pd-fact').textContent   = p.fact;

  const badge = document.getElementById('pd-view-badge');
  badge.textContent = VIEW_LABELS[p.view];
  badge.style.background = VIEW_BADGE_COLORS[p.view];

  const roomiEl = document.getElementById('pd-roomi');
  if (!explored.has(partId)) {
    roomiEl.textContent = ROOMI_EXPLORE[Math.min(explored.size, ROOMI_EXPLORE.length - 1)];
    explored.add(partId);
    updateDots();
    Audio.play('correct');
    if (explored.size === TOTAL_PARTS) {
      setTimeout(() => { roomiEl.textContent = '🤖 Wah! Tumne sab 12 parts dekh liye! Shaheen ho tum! 🌟'; }, 600);
    }
  } else {
    roomiEl.textContent = p.roomi;
    Audio.play('click');
  }
  lastPart = partId;
}

function switchView(view) {
  if (view === curView) return;
  Audio.play('click');

  const showEl = document.getElementById(view === 'front' ? 'svg-front' : 'svg-back');
  const hideEl = document.getElementById(view === 'front' ? 'svg-back'  : 'svg-front');

  hideEl.classList.add('sv-exiting');
  setTimeout(() => {
    hideEl.style.display = 'none';
    hideEl.classList.remove('sv-exiting');
    showEl.style.display = 'block';
    showEl.classList.add('sv-entering');
    showEl.addEventListener('animationend', () => showEl.classList.remove('sv-entering'), { once:true });
  }, 220);

  document.getElementById('btn-front').classList.toggle('active', view === 'front');
  document.getElementById('btn-back').classList.toggle('active', view === 'back');
  document.getElementById('view-label').textContent =
    view === 'front' ? '⬆️ Agla Hissa (سامنے)' : '🔄 Peechla Hissa (پیچھے)';

  curView = view;
}

document.addEventListener('DOMContentLoaded', () => {
  Progress.load();
  if (!Progress.hasProfile()) { window.location.replace('../index.html'); return; }
  Audio.init(Progress.data.settings);
  buildDots();

  document.querySelectorAll('.hotspot-g').forEach(g => {
    g.addEventListener('click', () => showPart(g.dataset.part));
  });

  document.getElementById('btn-quiz').addEventListener('click', () => {
    Audio.play('click');
    window.location.href = 'level.html?subject=science&level=1';
  });
});
</script>
