<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sikho Star — Number Blast</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💥</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    body { background: #0D1B2A; overflow: hidden; }

    #nb-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      background: rgba(13,27,42,0.9); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    #nb-header .back-btn { background: rgba(255,255,255,0.15); color: white; border: none;
      border-radius: 50%; width: 40px; height: 40px; font-size: 20px; cursor: pointer; }
    #nb-title { font-family: var(--font-heading); font-size: 20px; font-weight: 700; color: #FFD54F; }
    #nb-score-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    #nb-score { font-family: var(--font-heading); font-size: 18px; font-weight: 700; color: white; }
    #nb-next-label { font-family: var(--font-heading); font-size: 13px; color: #90CAF9; }

    #nb-arena {
      position: fixed; top: 62px; left: 0; right: 0; bottom: 64px;
      overflow: hidden;
    }

    .nb-bubble {
      position: absolute;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-heading); font-weight: 700; color: white;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4), inset 0 -4px 8px rgba(0,0,0,0.2), inset 0 4px 8px rgba(255,255,255,0.3);
      transition: transform 0.1s ease;
      animation: nb-float var(--rise-dur) linear forwards;
    }
    .nb-bubble:active { transform: scale(0.9); }
    .nb-bubble.wrong-tap { animation: shake 0.35s ease both; }
    .nb-bubble.correct-tap { animation: bubble-pop 0.35s ease forwards; }

    @keyframes nb-float {
      from { transform: translateY(0) rotate(0deg); opacity: 1; }
      to   { transform: translateY(var(--rise)) rotate(var(--spin)); opacity: 0.7; }
    }

    #nb-footer {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(13,27,42,0.9); backdrop-filter: blur(8px);
      padding: 12px 20px; display: flex; align-items: center; justify-content: center; gap: 12px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    #nb-lives { font-size: 28px; letter-spacing: 4px; }
    #nb-combo { font-family: var(--font-heading); font-size: 16px; font-weight: 700;
      color: #FFD54F; min-width: 80px; text-align: center; }

    #nb-start-screen, #nb-result-screen {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; padding: 32px; text-align: center;
      background: linear-gradient(135deg, #0D1B2A, #1a237e);
    }
    #nb-result-screen { display: none; }

    .nb-screen-title {
      font-family: var(--font-heading); font-size: clamp(32px,8vw,52px);
      font-weight: 700; color: #FFD54F;
    }
    .nb-screen-sub {
      font-family: var(--font-heading); font-size: 18px; color: rgba(255,255,255,0.85);
      max-width: 320px; line-height: 1.5;
    }

    #nb-stars-display { font-size: 52px; letter-spacing: 8px; animation: star-pop 0.5s 0.3s both; }
    #nb-result-score { font-family: var(--font-heading); font-size: 20px; color: white; }

    .nb-star-pip {
      width: 14px; height: 14px; border-radius: 50%;
      background: rgba(255,255,255,0.2); display: inline-block; margin: 0 3px;
    }
    .nb-star-pip.earned { background: #FFD54F; box-shadow: 0 0 8px #FFD54F; }

    #nb-combo-burst {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      font-family: var(--font-heading); font-size: 48px; font-weight: 700;
      color: #FFD54F; text-shadow: 0 4px 12px rgba(0,0,0,0.5);
      pointer-events: none; opacity: 0; z-index: 90;
    }
  </style>
</head>
<body>

<div id="nb-start-screen">
  <div style="font-size:72px; animation:float 2s ease-in-out infinite;">💥</div>
  <div class="nb-screen-title">Number Blast!</div>
  <div class="nb-screen-sub">Tap the bubbles in order — 1, 2, 3... as fast as you can! Miss 3 and it's game over!</div>
  <button class="btn btn-primary btn-large" onclick="startGame()" style="font-size:20px; padding:16px 40px;">
    🚀 Play!
  </button>
  <button onclick="window.location.href='dashboard.html'" style="background:none;border:none;color:rgba(255,255,255,0.6);font-family:var(--font-heading);font-size:16px;cursor:pointer;">← Back to Home</button>
</div>

<header id="nb-header" style="display:none;">
  <button class="back-btn" onclick="confirmExit()">←</button>
  <div id="nb-title">💥 Number Blast</div>
  <div id="nb-score-wrap">
    <div id="nb-score">Score: 0</div>
    <div id="nb-next-label">Next: <span id="nb-next-num">1</span></div>
  </div>
</header>

<div id="nb-arena"></div>

<footer id="nb-footer" style="display:none;">
  <div id="nb-lives">❤️❤️❤️</div>
  <div id="nb-combo"></div>
</footer>

<div id="nb-combo-burst"></div>

<div id="nb-result-screen">
  <div id="nb-result-emoji" style="font-size:80px;animation:bounce-in 0.6s ease both;">🏆</div>
  <div class="nb-screen-title" id="nb-result-title">Amazing!</div>
  <div id="nb-stars-display">⭐⭐⭐</div>
  <div id="nb-result-score"></div>
  <div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:8px;">
    <button class="btn btn-primary" onclick="startGame()">🔄 Play Again</button>
    <button class="btn btn-secondary" onclick="window.location.href='dashboard.html'">🏠 Home</button>
  </div>
</div>

<script src="../js/progress.js"></script>
<script src="../js/audio.js"></script>
<script>

const COLORS = [
  ['#E53935','#FF7043'], ['#8E24AA','#CE93D8'], ['#1E88E5','#64B5F6'],
  ['#00897B','#4DB6AC'], ['#F9A825','#FFD54F'], ['#C0392B','#E74C3C'],
  ['#2980B9','#5DADE2'], ['#27AE60','#58D68D'],
];

let age = 7;
let maxNum = 10, bubbleSize = 70, riseDur = 5, spawnRate = 1800;
let nextExpected = 1;
let lives = 3;
let score = 0;
let combo = 0;
let spawnTimer = null;
let activeBubbles = new Map(); // num → element
let gameRunning = false;
let missedNums = new Set();

function configForAge(a) {
  if (a <= 6)      return { maxNum:  5, size: 88, rise: 7000, rate: 2600 };
  if (a <= 8)      return { maxNum: 10, size: 70, rise: 5200, rate: 1900 };
  return               { maxNum: 15, size: 58, rise: 3800, rate: 1400 };
}

function startGame() {
  Progress.load();
  Audio.init(Progress.data?.settings || {});
  age = parseInt(Progress.data?.profile?.age) || 7;
  const cfg = configForAge(age);
  maxNum = cfg.maxNum; bubbleSize = cfg.size; riseDur = cfg.rise; spawnRate = cfg.rate;

  nextExpected = 1; lives = 3; score = 0; combo = 0;
  activeBubbles.clear(); missedNums.clear();
  gameRunning = true;

  document.getElementById('nb-start-screen').style.display = 'none';
  document.getElementById('nb-result-screen').style.display = 'none';
  document.getElementById('nb-header').style.display = 'flex';
  document.getElementById('nb-footer').style.display = 'flex';
  document.getElementById('nb-arena').innerHTML = '';

  updateHUD();
  clearInterval(spawnTimer);
  spawnTimer = setInterval(spawnBubble, spawnRate);
  spawnBubble(); // immediate first
}

function spawnBubble() {
  if (!gameRunning) return;
  if (activeBubbles.size >= maxNum) return;

  // pick a number not yet on screen, from 1..nextExpected+3 range
  const candidates = [];
  for (let n = 1; n <= Math.min(nextExpected + 3, maxNum); n++) {
    if (!activeBubbles.has(n) && !missedNums.has(n)) candidates.push(n);
  }
  if (!candidates.length) return;

  const num = candidates[Math.floor(Math.random() * candidates.length)];
  const arena = document.getElementById('nb-arena');
  const aW = arena.clientWidth; const aH = arena.clientHeight;

  const el = document.createElement('div');
  el.className = 'nb-bubble bounce-in';

  const col = COLORS[num % COLORS.length];
  const spin = (Math.random() > 0.5 ? 1 : -1) * (20 + Math.random() * 40) + 'deg';
  const riseVal = -(aH + bubbleSize + 40) + 'px';

  el.style.cssText = `
    width:${bubbleSize}px; height:${bubbleSize}px;
    font-size:${Math.round(bubbleSize * 0.44)}px;
    background: radial-gradient(circle at 35% 35%, ${col[1]}, ${col[0]});
    left:${Math.random() * (aW - bubbleSize)}px;
    bottom:-${bubbleSize}px;
    --rise:${riseVal}; --spin:${spin}; --rise-dur:${riseDur}ms;
  `;
  el.textContent = num;
  el.addEventListener('click', () => tapBubble(num, el));
  arena.appendChild(el);
  activeBubbles.set(num, el);

  /* auto-remove when animation ends */
  el.addEventListener('animationend', (e) => {
    if (e.animationName === 'nb-float') {
      if (activeBubbles.has(num)) {
        activeBubbles.delete(num);
        el.remove();
        if (num === nextExpected && !missedNums.has(num)) {
          handleMiss(num);
        }
      }
    }
  });
}

function tapBubble(num, el) {
  if (!gameRunning) return;
  if (num === nextExpected) {
    activeBubbles.delete(num);
    el.classList.add('correct-tap');
    setTimeout(() => el.remove(), 350);
    score += 10 + combo * 2;
    combo++;
    nextExpected++;
    Audio.play(combo >= 3 ? 'fanfare' : 'correct');
    if (combo >= 3) showComboBurst(`${combo}x COMBO! 🔥`);
    updateHUD();
    if (nextExpected > maxNum) roundComplete();
  } else if (num < nextExpected) {
    /* already passed — stale bubble, just pop it */
    activeBubbles.delete(num);
    el.remove();
  } else {
    /* wrong order */
    el.classList.add('wrong-tap');
    Audio.play('wrong');
    setTimeout(() => el.classList.remove('wrong-tap'), 380);
    combo = 0;
    loseLife();
  }
}

function handleMiss(num) {
  missedNums.add(num);
  combo = 0;
  Audio.play('miss');
  loseLife();
}

function loseLife() {
  lives--;
  updateHUD();
  if (lives <= 0) endGame();
}

function roundComplete() {
  gameRunning = false;
  clearInterval(spawnTimer);
  Audio.play('win');
  setTimeout(() => showResult(true), 600);
}

function endGame() {
  gameRunning = false;
  clearInterval(spawnTimer);
  document.getElementById('nb-arena').querySelectorAll('.nb-bubble').forEach(b => b.remove());
  activeBubbles.clear();
  Audio.play('levelup');
  setTimeout(() => showResult(false), 400);
}

function showResult(won) {
  document.getElementById('nb-header').style.display = 'none';
  document.getElementById('nb-footer').style.display = 'none';
  const screen = document.getElementById('nb-result-screen');
  screen.style.display = 'flex';

  const stars = won ? (combo >= 5 ? 3 : score >= maxNum * 15 ? 3 : 2) : (score >= maxNum * 8 ? 2 : 1);
  document.getElementById('nb-result-emoji').textContent = won ? '🏆' : (lives > 0 ? '😊' : '💪');
  document.getElementById('nb-result-title').textContent = won
    ? (stars === 3 ? 'Perfect! Outstanding!' : 'Well Done!')
    : (score >= maxNum * 8 ? 'Good Try!' : "Don't worry! Try again!");
  document.getElementById('nb-stars-display').textContent =
    Array.from({length:3}, (_,i) => i < stars ? '⭐' : '☆').join('');
  document.getElementById('nb-result-score').textContent = `Score: ${score} • Best streak: ${combo}`;

  launchConfetti(won ? 50 : 20);
}

function showComboBurst(text) {
  const el = document.getElementById('nb-combo-burst');
  el.textContent = text;
  el.style.opacity = '1';
  el.style.transform = 'translate(-50%,-50%) scale(1.3)';
  el.style.transition = 'none';
  setTimeout(() => {
    el.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
    el.style.opacity = '0';
    el.style.transform = 'translate(-50%,-80%) scale(1)';
  }, 100);
}

function updateHUD() {
  document.getElementById('nb-score').textContent = `Score: ${score}`;
  document.getElementById('nb-next-num').textContent = nextExpected <= maxNum ? nextExpected : '✓';
  document.getElementById('nb-lives').textContent = '❤️'.repeat(lives) + '🖤'.repeat(Math.max(0, 3 - lives));
  document.getElementById('nb-combo').textContent = combo >= 2 ? `🔥 ${combo}x` : '';
}

function launchConfetti(count) {
  const colors = ['#FFD54F','#F06292','#66BB6A','#4FC3F7','#FF9800','#CE93D8'];
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.cssText = `
        left:${Math.random()*100}vw; top:-20px;
        background:${colors[Math.floor(Math.random()*colors.length)]};
        width:${8+Math.random()*10}px; height:${8+Math.random()*10}px;
        border-radius:${Math.random()>0.5?'50%':'2px'};
        animation-duration:${1.5+Math.random()*2}s;
      `;
      document.body.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }, i * 30);
  }
}

function confirmExit() {
  if (confirm('Leave Number Blast? Game will end.')) {
    clearInterval(spawnTimer);
    window.location.href = 'dashboard.html';
  }
}

</script>
</body>
</html>
