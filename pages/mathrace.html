<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sikho Star — Math Race</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏎️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .mr-page {
      min-height: 100vh; display: flex; flex-direction: column;
      background: linear-gradient(160deg,#0F2027,#203A43,#2C5364);
      color: white; overflow: hidden;
    }

    #mr-start, #mr-result {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; padding: 32px; text-align: center;
      background: linear-gradient(135deg,#0F2027,#203A43,#2C5364);
    }
    #mr-result { display: none; }

    .mr-title { font-family: var(--font-heading); font-size: clamp(32px,8vw,52px);
      font-weight: 700; color: #FFD54F; }
    .mr-sub { font-family: var(--font-heading); font-size: 17px;
      color: rgba(255,255,255,0.85); max-width: 320px; line-height: 1.5; }
    .mr-stars { font-size: 52px; letter-spacing: 8px; animation: star-pop 0.5s 0.3s both; }

    /* Game HUD */
    #mr-hud {
      display: none; align-items: center; justify-content: space-between;
      padding: 12px 20px; background: rgba(0,0,0,0.3);
    }
    .mr-stat { font-family: var(--font-heading); font-size: 18px; font-weight: 700; }
    .mr-stat span { color: #FFD54F; }

    /* Timer ring */
    #mr-timer-wrap {
      display: none; align-items: center; justify-content: center; padding: 8px 0;
    }
    #mr-timer-ring { position: relative; width: 64px; height: 64px; }
    #mr-timer-ring svg { transform: rotate(-90deg); }
    #mr-timer-ring circle { fill: none; stroke-width: 5; }
    #mr-timer-ring .bg { stroke: rgba(255,255,255,0.1); }
    #mr-timer-ring .fg { stroke: #FFD54F; stroke-linecap: round;
      transition: stroke-dashoffset 1s linear, stroke 0.3s ease; }
    #mr-timer-num {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-family: var(--font-heading); font-size: 22px; font-weight: 700; color: white;
    }

    /* Equation display */
    #mr-eq-area {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 20px;
    }
    #mr-streak-msg {
      font-family: var(--font-heading); font-size: 20px; font-weight: 700;
      color: #FFD54F; min-height: 30px; text-align: center;
      animation: pop 0.3s ease both;
    }
    #mr-equation {
      font-family: var(--font-heading); font-size: clamp(42px,12vw,72px);
      font-weight: 700; color: white; text-align: center;
      text-shadow: 0 4px 20px rgba(0,0,0,0.4);
      animation: bounce-in 0.3s ease both;
      margin: 16px 0;
    }
    #mr-eq-hint {
      font-family: var(--font-heading); font-size: 17px; color: rgba(255,255,255,0.6);
    }

    /* Answer buttons */
    #mr-buttons {
      display: none;
      padding: 0 20px 32px; gap: 16px; flex-direction: row;
    }
    .mr-btn {
      flex: 1; padding: 24px 12px; border: none; border-radius: 24px;
      font-family: var(--font-heading); font-size: 28px; font-weight: 700;
      cursor: pointer; transition: all 0.15s ease;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .mr-btn:active { transform: scale(0.93); }
    #mr-btn-true { background: linear-gradient(135deg,#1B5E20,#4CAF50); color: white; }
    #mr-btn-false { background: linear-gradient(135deg,#B71C1C,#EF5350); color: white; }

    .mr-btn.flash-correct { animation: correct-flash 0.4s ease; background: #4CAF50 !important; }
    .mr-btn.flash-wrong   { animation: shake 0.4s ease both; }

    #mr-feedback {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
      font-family: var(--font-heading); font-size: 48px; font-weight: 700;
      pointer-events: none; opacity: 0; z-index: 90;
      text-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
<div class="mr-page fade-in">

<div id="mr-start">
  <div style="font-size:72px;animation:float 2s ease-in-out infinite;">🏎️</div>
  <div class="mr-title">Math Race!</div>
  <div class="mr-sub">Is the equation <span style="color:#4CAF50;font-weight:700;">TRUE</span> or <span style="color:#EF5350;font-weight:700;">FALSE</span>? Answer as many as you can before time runs out! 🕐</div>
  <button class="btn btn-primary btn-large" onclick="startGame()" style="font-size:20px;padding:16px 40px;">🚀 Race!</button>
  <button onclick="window.location.href='dashboard.html'" style="background:none;border:none;color:rgba(255,255,255,0.6);font-family:var(--font-heading);font-size:16px;cursor:pointer;">← Back to Home</button>
</div>

<div id="mr-hud">
  <div class="mr-stat">Score: <span id="mr-score">0</span></div>
  <div class="mr-stat">❤️ <span id="mr-lives-num">3</span></div>
  <div class="mr-stat">⏱ <span id="mr-time">60</span>s</div>
</div>

<div id="mr-timer-wrap">
  <div id="mr-timer-ring">
    <svg width="64" height="64" viewBox="0 0 64 64">
      <circle class="bg" cx="32" cy="32" r="27"/>
      <circle class="fg" id="mr-ring-fg" cx="32" cy="32" r="27"
        stroke-dasharray="169.6" stroke-dashoffset="0"/>
    </svg>
    <div id="mr-timer-num">60</div>
  </div>
</div>

<div id="mr-eq-area">
  <div id="mr-streak-msg"></div>
  <div id="mr-equation">?</div>
  <div id="mr-eq-hint">TRUE or FALSE?</div>
</div>

<div id="mr-buttons" style="display:flex;">
  <button class="mr-btn" id="mr-btn-true" onclick="answer(true)">✅ TRUE</button>
  <button class="mr-btn" id="mr-btn-false" onclick="answer(false)">❌ FALSE</button>
</div>

<div id="mr-feedback"></div>

<div id="mr-result">
  <div id="mr-res-emoji" style="font-size:80px;animation:bounce-in 0.6s ease both;">🏆</div>
  <div class="mr-title" id="mr-res-title">Amazing!</div>
  <div class="mr-stars" id="mr-res-stars">⭐⭐⭐</div>
  <div class="mr-sub" id="mr-res-score"></div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;">
    <button class="btn btn-primary" onclick="startGame()">🔄 Race Again</button>
    <button class="btn btn-secondary" onclick="window.location.href='dashboard.html'">🏠 Home</button>
  </div>
</div>

</div>
<script src="../js/progress.js"></script>
<script src="../js/audio.js"></script>
<script>

let age = 7;
let timeLeft = 60;
let lives = 3;
let score = 0;
let streak = 0;
let bestStreak = 0;
let correct = 0;
let total = 0;
let timerHandle = null;
let waiting = false;

/* Config per age */
function cfg(a) {
  if (a <= 6) return { time:90, ops:['+'], maxN:5 };
  if (a <= 8) return { time:60, ops:['+','-'], maxN:10 };
  return            { time:60, ops:['+','-','×'], maxN:12 };
}

let curCfg = {};
let curEq = null; /* { display, isTrue } */

function genEquation() {
  const ops = curCfg.ops;
  const op = ops[Math.floor(Math.random() * ops.length)];
  let a = 1 + Math.floor(Math.random() * curCfg.maxN);
  let b = 1 + Math.floor(Math.random() * curCfg.maxN);

  let realAnswer;
  if (op === '+') realAnswer = a + b;
  else if (op === '-') { if (a < b) [a,b] = [b,a]; realAnswer = a - b; }
  else { b = Math.min(b, 10); realAnswer = a * b; }

  const opSym = op === '×' ? '×' : op;

  /* 50/50 chance of showing correct or wrong answer */
  const showTrue = Math.random() > 0.45;
  let displayAnswer = realAnswer;
  if (!showTrue) {
    let offset = 1 + Math.floor(Math.random() * 3);
    if (Math.random() > 0.5) offset = -offset;
    displayAnswer = Math.max(0, realAnswer + offset);
    if (displayAnswer === realAnswer) displayAnswer += 1;
  }

  return {
    display: `${a} ${opSym} ${b} = ${displayAnswer}`,
    isTrue: showTrue,
  };
}

function startGame() {
  Progress.load();
  Audio.init(Progress.data?.settings || {});
  age = parseInt(Progress.data?.profile?.age) || 7;
  curCfg = cfg(age);

  timeLeft = curCfg.time; lives = 3; score = 0; streak = 0; bestStreak = 0;
  correct = 0; total = 0; waiting = false;

  document.getElementById('mr-start').style.display = 'none';
  document.getElementById('mr-result').style.display = 'none';
  document.getElementById('mr-hud').style.display = 'flex';
  document.getElementById('mr-timer-wrap').style.display = 'flex';
  document.getElementById('mr-buttons').style.display = 'flex';
  document.getElementById('mr-streak-msg').textContent = '';

  updateHUD();
  nextEquation();
  clearInterval(timerHandle);
  timerHandle = setInterval(tick, 1000);
}

function tick() {
  timeLeft--;
  updateHUD();
  if (timeLeft <= 0) {
    clearInterval(timerHandle);
    endGame();
  }
}

function updateHUD() {
  document.getElementById('mr-score').textContent = score;
  document.getElementById('mr-lives-num').textContent = lives;
  document.getElementById('mr-time').textContent = timeLeft;
  document.getElementById('mr-timer-num').textContent = timeLeft;

  const CIRC = 169.6;
  const maxTime = curCfg.time;
  const offset = CIRC * (1 - timeLeft / maxTime);
  const ring = document.getElementById('mr-ring-fg');
  ring.style.strokeDashoffset = offset;
  ring.style.stroke = timeLeft > 20 ? '#FFD54F' : timeLeft > 10 ? '#FF9800' : '#EF5350';
}

function nextEquation() {
  curEq = genEquation();
  const el = document.getElementById('mr-equation');
  el.style.animation = 'none';
  void el.offsetWidth;
  el.style.animation = 'bounce-in 0.3s ease both';
  el.textContent = curEq.display;
}

function answer(userSaysTrue) {
  if (waiting || !curEq) return;
  waiting = true;
  total++;

  const isRight = userSaysTrue === curEq.isTrue;
  const btnId = userSaysTrue ? 'mr-btn-true' : 'mr-btn-false';
  const btn = document.getElementById(btnId);

  if (isRight) {
    correct++;
    streak++;
    if (streak > bestStreak) bestStreak = streak;
    const bonus = Math.min(streak, 5);
    score += 10 + (bonus - 1) * 2;
    Audio.play(streak >= 4 ? 'fanfare' : 'correct');
    btn.classList.add('flash-correct');
    flashFeedback(streak >= 3 ? `🔥 ${streak} in a row!` : '✅');
    if (streak >= 3) {
      document.getElementById('mr-streak-msg').textContent = `🔥 ${streak} streak!`;
      document.getElementById('mr-streak-msg').style.animation = 'none';
      void document.getElementById('mr-streak-msg').offsetWidth;
      document.getElementById('mr-streak-msg').style.animation = 'pop 0.3s ease both';
    } else {
      document.getElementById('mr-streak-msg').textContent = '';
    }
    setTimeout(() => { btn.classList.remove('flash-correct'); waiting = false; nextEquation(); }, 350);
  } else {
    lives--;
    streak = 0;
    document.getElementById('mr-streak-msg').textContent = '';
    Audio.play('wrong');
    btn.classList.add('flash-wrong');
    flashFeedback('❌');
    updateHUD();
    setTimeout(() => { btn.classList.remove('flash-wrong'); waiting = false;
      if (lives <= 0) { clearInterval(timerHandle); endGame(); } else nextEquation(); }, 450);
  }

  updateHUD();
}

function flashFeedback(text) {
  const fb = document.getElementById('mr-feedback');
  fb.style.transition = 'none';
  fb.textContent = text;
  fb.style.opacity = '1';
  fb.style.transform = 'translate(-50%,-50%) scale(1.3)';
  setTimeout(() => {
    fb.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
    fb.style.opacity = '0';
    fb.style.transform = 'translate(-50%,-70%) scale(1)';
  }, 80);
}

function endGame() {
  document.getElementById('mr-hud').style.display = 'none';
  document.getElementById('mr-timer-wrap').style.display = 'none';
  document.getElementById('mr-buttons').style.display = 'none';

  const acc = total > 0 ? Math.round((correct / total) * 100) : 0;
  const stars = score >= 100 ? 3 : score >= 50 ? 2 : 1;

  document.getElementById('mr-result').style.display = 'flex';

  let emoji = '💪', title = 'Keep practising!';
  if (score >= 120) { emoji = '🏆'; title = 'Math Champion! 🎊'; }
  else if (score >= 70) { emoji = '⭐'; title = 'Excellent! Well done! 🌟'; }
  else if (score >= 40) { emoji = '😊'; title = 'Good job! Keep going! 👍'; }

  document.getElementById('mr-res-emoji').textContent = emoji;
  document.getElementById('mr-res-title').textContent = title;
  document.getElementById('mr-res-stars').textContent =
    Array.from({length:3}, (_,i) => i < stars ? '⭐' : '☆').join('');
  document.getElementById('mr-res-score').textContent =
    `Score: ${score} pts • ${correct}/${total} correct • Best streak: ${bestStreak}x`;

  Audio.play(score >= 70 ? 'win' : 'levelup');
  launchConfetti(score >= 70 ? 50 : 20);
}

function launchConfetti(count) {
  const colors = ['#FFD54F','#F06292','#66BB6A','#4FC3F7','#FF9800','#CE93D8'];
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.cssText = `
        left:${Math.random()*100}vw; top:-20px;
        background:${colors[Math.floor(Math.random()*colors.length)]};
        width:${8+Math.random()*10}px; height:${8+Math.random()*10}px;
        border-radius:${Math.random()>0.5?'50%':'2px'};
        animation-duration:${1.5+Math.random()*2}s;
      `;
      document.body.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }, i * 30);
  }
}
</script>
</body>
</html>
