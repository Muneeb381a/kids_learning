<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sikho Star — Profile</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .profile-page {
      min-height: 100vh;
      background: linear-gradient(160deg, #E3F2FD 0%, var(--bg-cream) 60%, #E8F5E9 100%);
      display: flex;
      flex-direction: column;
    }
    .profile-hero {
      background: linear-gradient(135deg, #283593, #1565C0);
      padding: 32px 20px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: white;
      text-align: center;
    }
    .hero-avatar { font-size: 80px; animation: float 3s ease-in-out infinite; }
    .hero-name {
      font-family: var(--font-heading);
      font-size: 28px;
      font-weight: 700;
      color: var(--sunny-yellow);
    }
    .hero-sub { font-size: 15px; opacity: 0.85; }
    .stats-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .stat-chip {
      background: rgba(255,255,255,0.18);
      border-radius: 16px;
      padding: 10px 16px;
      font-family: var(--font-heading);
      font-size: 16px;
      font-weight: 700;
      color: white;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .profile-body {
      padding: 20px 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 560px;
      margin: 0 auto;
      width: 100%;
    }
    .info-card {
      background: white;
      border-radius: var(--radius-sm);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
    }
    .info-card h3 {
      font-family: var(--font-heading);
      font-size: 17px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 12px;
    }
    .subject-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid #F5F5F5;
    }
    .subject-row:last-child { border-bottom: none; }
    .subj-icon { font-size: 24px; width: 30px; text-align: center; }
    .subj-name {
      font-family: var(--font-heading);
      font-size: 15px;
      font-weight: 600;
      flex: 1;
    }
    .subj-done {
      font-family: var(--font-heading);
      font-size: 14px;
      font-weight: 700;
      color: var(--text-medium);
    }
    .mini-bar {
      height: 6px;
      background: #E0E0E0;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }
    .mini-fill { height: 100%; border-radius: 3px; transition: width 1s ease; }
  </style>
</head>
<body>
<div class="profile-page fade-in">

  <div class="profile-hero">
    <a href="avatar.html" id="hero-avatar" style="display:inline-block;margin-bottom:4px;" title="Avatar badlo"></a>
    <div class="hero-name" id="hero-name">Loading...</div>
    <div class="hero-sub" id="hero-sub">Age: —</div>
    <div class="stats-row">
      <div class="stat-chip">⭐ <span id="h-stars">0</span> Stars</div>
      <div class="stat-chip">🔥 <span id="h-streak">0</span> Day Streak</div>
      <div class="stat-chip">📚 <span id="h-levels">0</span>/40 Levels</div>
    </div>
  </div>

  <div class="profile-body">

    <div class="info-card slide-in-up">
      <h3>📊 Subject Progress</h3>
      <div id="subject-rows"></div>
    </div>

    <div class="info-card slide-in-up delay-1">
      <h3>🏅 My Achievements</h3>
      <div id="achievements" style="display:flex; flex-wrap:wrap; gap:10px;"></div>
    </div>

    <a href="trophy.html" class="btn btn-primary btn-large slide-in-up delay-2" style="background:linear-gradient(135deg,#F57F17,#FF8F00);box-shadow:0 8px 24px rgba(245,127,23,0.4);">
      🏆 Trophy Room
    </a>
    <a href="avatar.html" class="btn btn-green btn-large slide-in-up delay-3">
      👤 Customise Avatar
    </a>
    <a href="dashboard.html" class="btn btn-secondary btn-large slide-in-up delay-4">
      🏠 Back to Home
    </a>
  </div>

  <nav class="bottom-bar">
    <a href="dashboard.html" class="nav-item">
      <span class="nav-icon">🏠</span><span class="nav-label">Home</span>
    </a>
    <a href="profile.html" class="nav-item active">
      <span class="nav-icon">👤</span><span class="nav-label">Profile</span>
    </a>
    <a href="stickers.html" class="nav-item">
      <span class="nav-icon">🎨</span><span class="nav-label">Stickers</span>
    </a>
    <a href="parent.html" class="nav-item">
      <span class="nav-icon">👨‍👩‍👧</span><span class="nav-label">Parents</span>
    </a>
  </nav>
</div>

<script src="../js/progress.js"></script>
<script src="../js/avatar.js"></script>
<script>
const SUBJECTS = [
  { key:'maths',   name:'Maths',   icon:'⛰️', color:'#5C6BC0' },
  { key:'science', name:'Science', icon:'🌊', color:'#26A69A' },
  { key:'english', name:'English', icon:'🏰', color:'#EF5350' },
  { key:'urdu',    name:'Urdu',    icon:'🌙', color:'#AB47BC' }
];

document.addEventListener('DOMContentLoaded', () => {
  Progress.load();
  if (!Progress.hasProfile()) { window.location.replace('../index.html'); return; }

  const { profile, totalStars, streak, progress } = Progress.data;

  renderAvatar(getAvatarConfig(profile), document.getElementById('hero-avatar'), 88);
  document.getElementById('hero-name').textContent = profile.name;
  document.getElementById('hero-sub').textContent    = `Umr: ${profile.age} saal • Member since ${profile.createdAt}`;
  document.getElementById('h-stars').textContent     = totalStars;
  document.getElementById('h-streak').textContent    = streak.current;

  let totalDone = 0;
  const rows = document.getElementById('subject-rows');
  SUBJECTS.forEach(s => {
    const done = progress[s.key].completed.length;
    totalDone += done;
    rows.innerHTML += `
      <div class="subject-row">
        <span class="subj-icon">${s.icon}</span>
        <div style="flex:1">
          <div class="subj-name">${s.name}</div>
          <div class="mini-bar">
            <div class="mini-fill" style="width:${done*10}%; background:${s.color}"></div>
          </div>
        </div>
        <div class="subj-done">${done}/10</div>
      </div>`;
  });

  document.getElementById('h-levels').textContent = totalDone;

  /* Achievements */
  const ach = document.getElementById('achievements');
  const badges = [
    { cond: totalDone >= 1,  icon:'🌟', label:'Pehla Level' },
    { cond: totalDone >= 10, icon:'🏅', label:'10 Levels Done' },
    { cond: totalDone >= 20, icon:'🥈', label:'Half Way!' },
    { cond: totalDone >= 40, icon:'🏆', label:'All Levels!' },
    { cond: streak.current >= 3,  icon:'🔥', label:'3-Day Streak' },
    { cond: streak.current >= 7,  icon:'🔥🔥', label:'1 Week!' },
    { cond: totalStars >= 10, icon:'⭐', label:'10 Stars' },
    { cond: totalStars >= 30, icon:'🌟', label:'30 Stars!' },
  ];
  const earned = badges.filter(b => b.cond);
  if (earned.length === 0) {
    ach.innerHTML = '<p style="color:var(--text-medium);font-size:14px;">Play and earn badges! 🎮</p>';
  } else {
    earned.forEach(b => {
      ach.innerHTML += `<div style="text-align:center; padding:10px; background:var(--bg-cream); border-radius:12px; font-size:13px; font-family:var(--font-heading); font-weight:600;">
        <div style="font-size:28px;">${b.icon}</div>${b.label}</div>`;
    });
  }
});
</script>
</body>
</html>
