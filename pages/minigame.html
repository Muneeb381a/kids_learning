<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sikho Star — Memory Match</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    body { background: linear-gradient(135deg, #1a237e 0%, #283593 50%, #0288D1 100%); min-height: 100vh; }

    .game-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 520px;
      margin: 0 auto;
    }

    .game-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: white;
    }

    .game-title {
      font-family: var(--font-heading);
      font-size: 18px;
      font-weight: 700;
      color: white;
      flex: 1;
    }

    .game-stat {
      background: rgba(255,255,255,0.2);
      border-radius: 14px;
      padding: 6px 14px;
      font-family: var(--font-heading);
      font-size: 16px;
      font-weight: 700;
      color: white;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Progress dots */
    .match-progress {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 8px 20px;
    }

    .match-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      transition: background 0.3s ease;
    }

    .match-dot.done { background: var(--sunny-yellow); }

    /* Card grid */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 8px 16px 24px;
      flex: 1;
      align-content: center;
    }

    /* Memory card */
    .mem-card {
      aspect-ratio: 1;
      cursor: pointer;
      perspective: 600px;
    }

    .mem-card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.38s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 14px;
    }

    .mem-card.flipped .mem-card-inner,
    .mem-card.matched .mem-card-inner {
      transform: rotateY(180deg);
    }

    .mem-card.matched .mem-card-inner {
      transition: transform 0.38s ease;
    }

    .card-face, .card-back {
      position: absolute;
      width: 100%; height: 100%;
      border-radius: 14px;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(26px, 7vw, 38px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }

    /* Back of card */
    .card-back {
      background: linear-gradient(135deg, #0288D1, #01579B);
      color: var(--sunny-yellow);
      font-size: clamp(20px, 5vw, 28px);
      border: 2px solid rgba(255,255,255,0.2);
    }

    /* Front of card */
    .card-face {
      background: white;
      border: 3px solid #E0E0E0;
      transform: rotateY(180deg);
    }

    .mem-card.matched .card-face {
      background: #E8F5E9;
      border-color: var(--success-green);
      animation: pop 0.4s ease both;
    }

    .mem-card:not(.flipped):not(.matched):hover .mem-card-inner {
      transform: scale(1.06) rotateY(5deg);
    }

    /* Result overlay */
    #game-result {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #1a237e, #283593);
      z-index: 300;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 32px;
      text-align: center;
    }

    #game-result.show { display: flex; }

    .res-mascot { font-size: 88px; animation: bounce-in 0.6s ease both; }
    .res-title {
      font-family: var(--font-heading);
      font-size: clamp(24px, 6vw, 38px);
      font-weight: 700;
      color: var(--sunny-yellow);
    }
    .res-detail {
      font-family: var(--font-heading);
      font-size: 18px;
      color: rgba(255,255,255,0.9);
    }
    .res-stars { font-size: 48px; letter-spacing: 8px; }
    .res-btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
  </style>
</head>
<body>
<div class="game-page fade-in">

  <div class="game-header">
    <button class="back-btn" style="color:white;" onclick="confirmExit()">←</button>
    <div class="game-title" id="theme-name">🎮 Memory Match</div>
    <div class="game-stat">🎯 <span id="moves-count">0</span></div>
    <div class="game-stat">✅ <span id="match-count">0</span>/8</div>
  </div>

  <!-- Match progress dots -->
  <div class="match-progress" id="match-progress">
    <!-- 8 dots injected by JS -->
  </div>

  <div class="card-grid" id="card-grid"></div>

</div>

<!-- RESULT OVERLAY -->
<div id="game-result">
  <span class="res-mascot" id="res-mascot">🤖</span>
  <div class="res-title" id="res-title">Shabaash!</div>
  <div class="res-stars" id="res-stars">⭐⭐⭐</div>
  <div class="res-detail" id="res-detail">16 moves mein complete!</div>
  <div class="res-btns">
    <button class="btn btn-primary" id="btn-play-again">Dobara 🔄</button>
    <button class="btn btn-secondary" id="btn-go-back">Wapas Jao 🏠</button>
  </div>
</div>

<script src="../js/progress.js"></script>
<script src="../js/audio.js"></script>
<script src="../js/minigame.js"></script>
</body>
</html>
